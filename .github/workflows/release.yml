name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            label: macOS (Universal)

          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
            label: Linux

          - platform: windows-latest
            args: ""
            rust-targets: ""
            label: Windows

    runs-on: ${{ matrix.platform }}
    name: Build – ${{ matrix.label }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app and create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          tagName: ${{ github.ref_name }}
          releaseName: PenFlow v__VERSION__

          releaseBody: |
            ## PenFlow v__VERSION__

            Initial public release of PenFlow — a cross-platform desktop application for controlling GRBL-based pen plotters.

            ### Features
            - SVG import with drag & drop
            - Vector slicing
            - Raster slicing
            - A4 preview canvas
            - Automatic 12-pen color separation
            - Live machine control
            - GRBL serial streaming
            - Plot time estimation

            ### Downloads

            | Platform | File |
            |-----------|------|
            | macOS Universal | `.dmg` |
            | Windows x64 | `.msi` |
            | Linux | `.AppImage`, `.deb` |

          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}