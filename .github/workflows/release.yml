name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            label: macOS (Universal)
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
            label: Linux
          - platform: windows-latest
            args: ''
            rust-targets: ''
            label: Windows

    runs-on: ${{ matrix.platform }}
    name: Build – ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PenFlow v__VERSION__'
          releaseBody: |
            ## PenFlow v__VERSION__

            Desktop app for controlling GRBL-based pen plotters with SVG slicing and automatic 12-pen color separation.

            ### Downloads

            | Platform | Installer |
            |----------|-----------|
            | macOS (Apple Silicon + Intel) | PenFlow_*_universal.dmg |
            | Windows 64-bit | PenFlow_*_x64-setup.exe |
            | Linux AppImage | PenFlow_*_amd64.AppImage |
            | Linux Debian | PenFlow_*_amd64.deb |

            macOS note: If Gatekeeper blocks the app, right-click then Open.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
